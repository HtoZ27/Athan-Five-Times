[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "athan-five-times"
version = "0.3.8b"
description = "Athan Five Times - Prayer Times Application"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.1",
    "adhan==0.1.1",
    "miniaudio==1.71",
    "cffi==1.16.0",
    "pycparser==2.21",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff==0.15.16",
]

[project.gui-scripts]
athan-five-times = "backend.main:main"

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "E402",  # deferred imports avoid circular dependencies by design
    "E501",  # long lines (Arabic strings, URLs) tolerated
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
