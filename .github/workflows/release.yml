name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfuse2 dpkg-dev
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Check tag matches packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c "import re; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")"
          [ "$TAG" = "$VER" ] || { echo "tag v$TAG != pyproject $VER"; exit 1; }
      - name: Run test suite
        run: python -m pytest tests/ -q --tb=short
      - name: AppDir sync (regenerate derived staging)
        run: bash scripts/sync-appdir.sh
      - name: Build .deb
        run: bash packaging/debian/build-deb.sh
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool AppDir Athan-Five-Times-x86_64.AppImage
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Athan-Five-Times-x86_64.AppImage
            athan-five-times_*_all.deb
          fail_on_unmatched_files: true
