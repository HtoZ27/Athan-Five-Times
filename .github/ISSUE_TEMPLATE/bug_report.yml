name: Bug report
description: Report a problem with the app
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: "e.g. 0.3.16b (see About dialog)"
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Linux distribution / desktop
      options:
        - Ubuntu/GNOME
        - Fedora/GNOME
        - KDE
        - XFCE
        - Other (describe below)
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Run from a terminal and paste relevant output
      render: shell
